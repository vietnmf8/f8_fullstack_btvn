<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--CSS-->
    <link rel="stylesheet" href="./common.css">
    <link rel="stylesheet" href="./dialog.css">
    <title>Vite App</title>
  </head>
  <body>
    <div id="app">
      <!--Start Code -->
      <div class="container">
        <div class="search-bar">
          <input placeholder="search employees" name="search"/>
          <button id="add-new-btn">Add new</button>
        </div>
        <table cellspacing="0">
          <thead>
          <tr>
          </tr>
          </thead>

          <tbody>
          </tbody>
        </table>

        <div class="dialog-container">
          <div class="overlay">
            <div class="dialog">
              <div class="dialog-title">
                Create Employee
              </div>
              <div class="dialog-content">
                <input name="name" placeholder="name" autocomplete="off">
                <input name="address" placeholder="address" autocomplete="off">
                <input name="age" placeholder="age" autocomplete="off" type="number">
              </div>
              <div class="dialog-action">
                <button class="cancel-btn" onclick="onCloseDialog()">Cancel</button>
                <button class="save-btn">Save</button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- End code -->
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
