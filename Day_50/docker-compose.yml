services:
  next:
    container_name: docker-k14-next
    image: node:24-alpine3.21
    working_dir: /app/next
    volumes:
      - './next:/app/next'
    ports:
      - 3000:3000
    command:
      - npm
      - run
      - dev

  db:
    container_name: db
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: default
    ports:
      - 5000:5432
    volumes:
      - './db:/var/lib/postgresql/data'

  btvn:
    container_name: btvn
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: default
    ports:
      - 2510:5432
    volumes:
      - './btvn:/var/lib/postgresql/data'

  trenLop:
    container_name: trenLop
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: default
    ports:
      - 2510:5432
    volumes:
      - './trenLop:/var/lib/postgresql/data'