<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
    <link rel="stylesheet" href="6.baseBTVN-common.css">
    <link rel="stylesheet" href="6.baseBTVN.css">
    <title>Document</title>
</head>
<body>
<div class="container">
    <div class="search-bar">
        <input placeholder="search employees" type="text" name="search">
        <button onclick="onOpenDialog(null)">Add new</button> <!--Hiển thị dialog ở trạng thái create-->
    </div>

    <table cellspacing="0">
        <thead> <!--thead-->
        <tr>    <!--Hàng tiêu dề-->

        </tr>
        </thead>

        <tbody> <!--tbody-->

        </tbody>
    </table>

    <!--Dialog-->
    <!--Javascript Inline-->
    <div class="dialog-container">
        <div class="overlay">
            <div class="dialog">
                <div class="dialog-title">Create Employee</div>
                <div class="dialog-content">
                    <input name="name" placeholder="name" autocomplete="off"/> <!--Để không hiện trường đã nhập-->
                    <input name="address" placeholder="address" autocomplete="off"/>
                    <input name="age" placeholder="age" autocomplete="off"/>
                </div>
                <div class="dialog-action">
                    <button class="cancel-btn" onclick="onCloseDialog()">Cancel</button>
                    <button class="save-btn" onclick="onSave()">Save</button>
                </div>
            </div>
        </div>
    </div>
</div>
