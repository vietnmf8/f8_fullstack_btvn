<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="main.css">
    <title>Document</title>
</head>
<body>
<div class="container">
    <div class="search-bar">
        <input placeholder="search employees" type="text" name="search" autocomplete="off">
        <button>Add new</button> <!--Hiển thị dialog ở trạng thái create-->
    </div>

    <table cellspacing="0">
        <thead> <!--thead-->
        <tr>    <!--Hàng tiêu dề-->

        </tr>
        </thead>

        <tbody> <!--tbody-->

        </tbody>
    </table>

    <!--Dialog-->
    <!--Javascript Inline-->
    <div class="dialog-container">
        <div class="overlay">
            <div class="dialog">
                <div class="dialog-title">Create Employee</div>
                <div class="dialog-content">
                    <input name="name" placeholder="name" autocomplete="off"/> <!--Để không hiện trường đã nhập-->
                    <input name="address" placeholder="address" autocomplete="off"/>
                    <input name="age" placeholder="age" autocomplete="off"/>

<!--                    Thêm ComboBox (Tạm ẩn)-->
                    <div class="autocomplete">
                        <input name="province" placeholder="province" autocomplete="off"/>
                        <div class="dropdown">

                        </div>
                    </div>
                </div>
                <div class="dialog-action">
                    <button class="cancel-btn">Cancel</button>
                    <button class="save-btn">Save</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!--Dia-log xác nhân xoá nhân viên-->
<div class="dialog-container" id="deleteConfirmPopup">
    <div class="popup">
        <!--Tiêu đề chính là tên của Employee -> xử lý bằng JS-->
        <h2 id="deleteTitle"></h2>
        <p>Ban có chắc xoá dữ liệu này không?</p>
        <div class="dialog-action">
            <button type="button" class="popup-no-btn" id="noDeleteBtn">No</button>
            <button type="button" class="popup-yes-btn" id="yesDeleteBtn">Yes</button>
        </div>
    </div>
</div>

<!-- Load modules -->
<script type="module" src="data.js"></script> <!-- Step: 0-->
<script type="module" src="renderTable.js"></script> <!-- Step: 1-->
<script type="module" src="tienIch.js"></script>
<script type="module" src="search.js"></script> <!-- Step: 2-->
<script type="module" src="dialog.js"></script> <!-- Step: 3-->
<script type="module" src="renderDropdown.js"></script> <!-- Step: 4-->
</body>
</html>
