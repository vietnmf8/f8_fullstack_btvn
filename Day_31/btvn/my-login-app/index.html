<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        @import url('https://fonts.googleapis.com/css?family=Raleway:400,700');

        body {
            background: #c0c0c0;
            font-family: Raleway, sans-serif;
            color: #666;
        }

        .login {
            margin: 20px auto;
            padding: 40px 50px;
            max-width: 300px;
            border-radius: 5px;
            background: #fff;
            box-shadow: 1px 1px 1px #666;
        }

        .login input {
            width: 100%;
            display: block;
            box-sizing: border-box;
            margin: 10px 0;
            padding: 14px 12px;
            font-size: 16px;
            border-radius: 2px;
            font-family: Raleway, sans-serif;
        }

        .login input[type=email],
        .login input[type=password] {
            border: 1px solid #c0c0c0;
            transition: .2s;
        }

        .login input[type=email]:hover,
        .login input[type=password]:hover {
            border-color: #F44336;
            outline: none;
            transition: all .2s ease-in-out;
        }

        .log-in {
            width: 100%;
            height: 48px;
            border: none;
            background: #EF5350;
            color: white;
            font-weight: bold;
            transition: 0.2s;
            margin: 20px 0px;
            cursor: pointer;
        }

        .log-in:hover {
            background: #F44336;
        }

        .log-in:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .login h2 {
            margin: 20px 0 0;
            color: #EF5350;
            font-size: 28px;
        }

        .login p {
            margin-bottom: 40px;
        }

        .login h2,
        .login p {
            text-align: center;
        }

        /* Thông báo lỗi */
        .error-message {
            color: #F44336;
            font-size: 14px;
            margin: 5px 0;
            display: none;
        }

        .success-message {
            color: #4CAF50;
            font-size: 14px;
            margin: 5px 0;
            display: none;
        }
    </style>
</head>
<body>
<form class="login" id="loginForm">
    <h2>Welcome, User!</h2>
    <p>Please log in</p>

    <input type="email" id="email" placeholder="Email" required />
    <div class="error-message" id="emailError">Vui lòng nhập email hợp lệ</div>

    <input type="password" id="password" placeholder="Password" required minlength="6" />
    <div class="error-message" id="passwordError">Mật khẩu phải có ít nhất 6 ký tự</div>

    <div class="error-message" id="loginError"></div>
    <div class="success-message" id="loginSuccess">Đăng nhập thành công!</div>

    <button type="submit" class="log-in" id="loginBtn">Log In</button>
</form>


<script src="api.js"></script>
<script src="auth.js"></script>
<script src="validation.js"></script>
<script src="login.js"></script>
</body>
</html>
