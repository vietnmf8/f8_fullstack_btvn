<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <!--Embed Icon-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
    <!--Embed CSS-->
    <link rel="stylesheet" href="kiemTra.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <!-- Action -->
        <div class="action">
            <!--Ô SearchStr-->
            <input name="search" id="search" placeholder="Search Employee">
            <!-- Select - Option -->
            <select name="name" id="name">
                <option value="" disabled selected hidden="hidden">Name</option>
                <option value="1">Nguyen Minh Viet</option>
                <option value="2">Tran Thuy Quynh</option>
                <option value="3">Tran Cong Tin</option>
                <option value="4">Nguyen Nam Tao</option>
                <option value="5">Bui Kong Minh</option>
            </select>
            <!-- Button -->
            <button>Create Schedule</button>
        </div>

        <!--Table-->
        <table cellspacing="0">
            <thead>     <!--Thead-->
                <tr>
                    <th>Name</th>
                    <th>Team</th>
                    <th>Mon</th>
                    <th>Tue</th>
                    <th>Wed</th>
                    <th>Thu</th>
                    <th>Fri</th>
                </tr>
            </thead>

            <tbody>     <!--Tbody-->


            </tbody>
        </table>
    </div>

    <script src="./kiemTra.js"></script>
</body>
</html>
