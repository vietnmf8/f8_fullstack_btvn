<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
<div class="time">3</div>

<script>
    const timeRef = document.querySelector('.time');
    let countdown = 3;
    // Hàm set thời gian
    const setTime = () => {
        timeRef.innerText = --countdown;
        if (countdown === 0) {
            clearInterval(itv)
        }
    }
    // Hàm bắt đầu đếm thời gian
    const itv = setInterval(setTime, 1000)
</script>
</body>
</html>
